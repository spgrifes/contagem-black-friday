<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Contagem de Mercadoria Black Friday</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Nunito+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* Identidade SP Grifes: preto, dourado e branco. Layout: uma coluna de cartoes grandes, pensada para celular. */
:root{
  --preto:#111111;
  --dourado:#f5c518;
  --dourado-escuro:#a67c00;
  --branco:#ffffff;
  --cinza:#f3f3f1;
  --linha:#e2e2de;
  --verde:#1f8a46;
  --vermelho:#c62828;
  --titulo:'Montserrat',system-ui,Arial,sans-serif;
  --corpo:'Nunito Sans',system-ui,Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--cinza);color:var(--preto);font-family:var(--corpo);font-size:18px;line-height:1.35}
button,input,textarea{font-family:inherit}
.topo{position:sticky;top:0;z-index:20;background:var(--preto);color:var(--branco);padding:10px 16px;border-bottom:3px solid var(--dourado)}
.topo .linha1{display:flex;justify-content:space-between;align-items:center;gap:12px}
.marca{font-family:var(--titulo);font-weight:800;letter-spacing:.06em;color:var(--dourado);font-size:17px}
.quem{font-size:15px;color:#d8d8d8;text-align:right}
.barra{height:8px;background:#3a3a3a;border-radius:6px;margin-top:8px;overflow:hidden}
.barra i{display:block;height:100%;background:var(--dourado);width:0;transition:width .3s}
.contador{font-size:15px;margin-top:5px;color:#e8e8e8}
.contador b{color:var(--dourado)}
.abas{display:flex;gap:8px;padding:10px 16px;background:var(--branco);border-bottom:1px solid var(--linha);overflow-x:auto}
.abas button{flex:1;min-width:92px;padding:12px 8px;border:2px solid var(--preto);background:var(--branco);color:var(--preto);border-radius:12px;font-weight:800;font-size:16px}
.abas button.on{background:var(--preto);color:var(--dourado)}
.caixa{max-width:560px;margin:0 auto;padding:16px}
h1,h2{font-family:var(--titulo);margin:0 0 6px;line-height:1.15}
h1{font-size:25px}
h2{font-size:21px}
.dica{font-size:16px;color:#555;margin:0 0 14px}
.entrada{padding-top:28px}
.entrada .selo{display:inline-block;background:var(--dourado);color:var(--preto);font-family:var(--titulo);font-weight:800;font-size:13px;letter-spacing:.08em;padding:5px 10px;border-radius:6px;margin-bottom:12px}
label.campo{display:block;font-weight:800;font-size:16px;margin:14px 0 4px}
input.texto{width:100%;font-size:21px;padding:14px;border:2px solid #bdbdb8;border-radius:12px;background:var(--branco)}
input.texto:focus,textarea:focus,.grade input:focus{outline:3px solid var(--dourado);border-color:var(--preto)}
.botao{display:block;width:100%;border:0;border-radius:14px;padding:17px;font-size:20px;font-weight:800;font-family:var(--titulo);background:var(--preto);color:var(--dourado);margin-top:16px}
.botao.verde{background:var(--verde);color:var(--branco);margin-top:6px}
.botao.cinza{background:#6b6b6b;color:var(--branco);margin-top:6px}
.botao:disabled{opacity:.55}
.setor{display:flex;justify-content:space-between;align-items:center;width:100%;margin:10px 0;padding:20px 18px;border:0;border-radius:14px;background:var(--branco);border:2px solid var(--preto);font-size:22px;font-weight:800;font-family:var(--titulo);color:var(--preto);text-align:left}
.setor span{font-family:var(--corpo);font-size:16px;font-weight:700;color:#555}
.setor:active{background:var(--dourado)}
.bloco{margin:22px 0 10px;padding:10px 14px;background:var(--preto);color:var(--dourado);border-radius:10px;font-family:var(--titulo);font-weight:700;font-size:16px}
.cartao{background:var(--branco);border:3px solid var(--linha);border-radius:18px;overflow:hidden;margin-bottom:20px}
.cartao.ok{border-color:var(--verde)}
.foto{width:100%;aspect-ratio:1/1;object-fit:contain;background:#fafaf8;display:flex;align-items:center;justify-content:center;color:#999;font-size:16px}
.nome{padding:12px 14px 0;font-family:var(--titulo);font-size:20px;font-weight:700;line-height:1.2}
.cor{padding:4px 14px 10px;font-size:22px;font-weight:800;color:var(--dourado-escuro)}
.grade{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:0 14px 12px}
.grade label{display:block;text-align:center;font-weight:800;font-size:18px;margin-bottom:4px}
.grade input{width:100%;font-size:30px;font-weight:800;text-align:center;padding:12px 0;border:2px solid #bdbdb8;border-radius:12px;background:var(--branco)}
.site{display:block;text-align:center;font-size:13px;color:#777;margin-top:3px}
.obs{display:flex;gap:8px;padding:0 14px 12px}
.obs textarea{flex:1;border:2px solid #d0d0cb;border-radius:12px;padding:10px;font-size:17px;resize:vertical;min-height:48px}
.obs .mic{width:54px;border:2px solid var(--preto);background:var(--branco);border-radius:12px;font-weight:800;font-size:13px}
.obs .mic.gravando{background:var(--vermelho);color:var(--branco);border-color:var(--vermelho)}
.cartao .botao{margin:0 14px 14px;width:calc(100% - 28px)}
.feito{padding:0 14px 8px;font-size:15px;font-weight:800;color:var(--verde)}
.aviso{position:fixed;left:14px;right:14px;bottom:16px;z-index:50;padding:16px;border-radius:14px;text-align:center;font-size:18px;font-weight:800;background:var(--preto);color:var(--branco);display:none;box-shadow:0 6px 20px rgba(0,0,0,.3)}
.aviso.erro{background:var(--vermelho)}
.aviso.bom{background:var(--verde)}
.vazio{text-align:center;color:#666;padding:30px 0}
.link{display:block;width:100%;margin-top:22px;padding:14px;border:0;background:none;color:#555;font-size:16px;font-weight:800;text-decoration:underline}
.pl{margin:0 0 14px}
.pl1{display:flex;justify-content:space-between;gap:10px;font-size:17px;margin-bottom:5px}
.pl1 span{color:#555;font-size:15px}
.pb{height:14px;background:#dcdcd7;border-radius:8px;overflow:hidden}
.pb i{display:block;height:100%;background:var(--dourado);border-right:2px solid var(--preto)}
.dupla{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--branco);border:2px solid var(--linha);border-radius:12px;padding:12px 14px;margin-bottom:8px;font-size:18px}
.dupla span{display:block;font-size:14px;color:#666;margin-top:2px}
.dupla strong{font-family:var(--titulo);font-size:24px;color:var(--dourado-escuro)}
.obsl{background:var(--branco);border-left:5px solid var(--dourado);border-radius:10px;padding:10px 14px;margin-bottom:10px}
.obsl em{color:#666;font-style:normal;font-size:15px}
.obsl p{margin:4px 0;font-size:17px}
.setorap{background:var(--branco);border:2px solid var(--linha);border-radius:14px;padding:12px 14px;margin-bottom:12px}
.setorap .nomes{font-family:var(--titulo);font-weight:800;font-size:18px;margin:8px 0 4px}
.ritmo{font-size:15px;margin-top:4px}
.ritmo.bom{color:var(--verde);font-weight:700}
.ritmo.atraso{color:var(--vermelho);font-weight:800}
.obsl span{font-size:14px;color:#666}
@media (prefers-reduced-motion:reduce){.barra i{transition:none}}
</style>
</head>
<body>
<div id="app"></div>
<div class="aviso" id="aviso" role="status" aria-live="polite"></div>

<script>
(function(){
  var API = 'https://cuiqmczhtcrrxafmzmhh.supabase.co/functions/v1/contagem';
  var S = { senha:'', eu:'', par:'', modo:'contar', setor:0, linhas:[], fb:'', setores:{} };
  var app = document.getElementById('app');

  function $(s,r){ return (r||document).querySelector(s); }
  function esc(t){ return String(t==null?'':t).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
  function guardar(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
  function ler(k){ try{ return localStorage.getItem(k)||''; }catch(e){ return ''; } }

  var tAviso;
  function aviso(txt, tipo, ms){
    var a = $('#aviso'); a.textContent = txt; a.className = 'aviso' + (tipo? ' '+tipo : ''); a.style.display = 'block';
    clearTimeout(tAviso); tAviso = setTimeout(function(){ a.style.display='none'; }, ms||2000);
  }

  function chamar(acao, extra, corpo){
    var q = new URLSearchParams(Object.assign({acao:acao, senha:S.senha}, extra||{}));
    var opt = corpo ? { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(Object.assign({senha:S.senha}, corpo)) } : {};
    return fetch(API+'?'+q.toString(), opt).then(function(r){
      return r.json().catch(function(){ return {erro:'rede'}; }).then(function(j){
        if(!r.ok) throw new Error(j.erro||'erro');
        return j;
      });
    });
  }

  /* ---------- Entrada ---------- */
  function entrada(){
    app.innerHTML =
      '<div class="topo"><div class="linha1"><span class="marca">SP GRIFES</span></div></div>'+
      '<div class="caixa entrada">'+
      '<span class="selo">BLACK FRIDAY 2026</span>'+
      '<h1>Conferência de estoque</h1>'+
      '<p class="dica">Preencha uma vez. Tudo que você salvar fica gravado e aparece para a equipe em qualquer aparelho.</p>'+
      '<label class="campo" for="eu">Seu nome (quem está digitando)</label>'+
      '<input class="texto" id="eu" autocomplete="off" value="'+esc(ler('cn_eu'))+'">'+
      '<label class="campo" for="par">Nome da sua dupla (quem está contando)</label>'+
      '<input class="texto" id="par" autocomplete="off" value="'+esc(ler('cn_par'))+'">'+
      '<label class="campo" for="sen">Senha</label>'+
      '<input class="texto" id="sen" type="password" autocomplete="off">'+
      '<button class="botao" id="entrar">Entrar</button>'+
      '<button class="link" id="evolta">Voltar</button>'+
      '</div>';
    $('#entrar').onclick = entrar;
    $('#evolta').onclick = inicio;
    $('#sen').addEventListener('keydown', function(e){ if(e.key==='Enter') entrar(); });
  }

  function entrar(){
    S.eu = $('#eu').value.trim(); S.par = $('#par').value.trim(); S.senha = $('#sen').value;
    if(!S.eu || !S.par || !S.senha){ aviso('Preencha seu nome, o da dupla e a senha','erro',2600); return; }
    var b = $('#entrar'); b.disabled = true; b.textContent = 'Entrando...';
    chamar('entrar').then(function(r){
      if(!r.aberta){ aviso('A conferência está encerrada','erro',3000); b.disabled=false; b.textContent='Entrar'; return; }
      guardar('cn_eu',S.eu); guardar('cn_par',S.par);
      S.setores = r.setores || {};
      escolherSetor();
    }).catch(function(e){
      b.disabled = false; b.textContent = 'Entrar';
      aviso(e.message==='senha' ? 'Senha errada' : 'Sem conexão. Tente de novo','erro',2800);
    });
  }


  /* ---------- Inicio: so dois botoes ---------- */
  function topoSimples(extra){
    return '<div class="topo"><div class="linha1"><span class="marca">SP GRIFES</span><span class="quem">'+esc(extra||'')+'</span></div></div>';
  }
  function inicio(){
    clearInterval(timerPainel);
    S.senha=''; S.eu=''; S.par='';
    app.innerHTML = topoSimples()+'<div class="caixa entrada"><span class="selo">BLACK FRIDAY 2026</span><h1>O que você vai fazer?</h1><p class="dica">Toque em uma opção.</p>'+
      '<button class="setor" id="oconf">Conferência de estoque<span>contar a mercadoria</span></button>'+
      '<button class="setor" id="osub">Baixa de produto<span>tirar do estoque a peça trocada</span></button>'+
      '<button class="link" id="areaf">Área do Fábio</button></div>';
    $('#oconf').onclick = entrada;
    $('#osub').onclick = baixaEntrada;
    $('#areaf').onclick = painelEntrada;
  }
  /* ---------- Baixa de produto ---------- */
  function baixaEntrada(){
    app.innerHTML = topoSimples()+'<div class="caixa entrada"><span class="selo">BLACK FRIDAY 2026</span><h1>Baixa de produto</h1>'+
      '<p class="dica">Digite a sua senha pessoal. Ela mostra quem fez a baixa.</p>'+
      '<label class="campo" for="bsen">Sua senha pessoal</label><input class="texto" id="bsen" type="password" autocomplete="off">'+
      '<button class="botao" id="bok">Entrar</button><button class="link" id="bvolta0">Voltar</button></div>';
    $('#bvolta0').onclick = inicio;
    function ir(){
      var v=$('#bsen').value; if(!v){ aviso('Digite a sua senha','erro',2200); return; }
      S.senha=v; var b=$('#bok'); b.disabled=true; b.textContent='Entrando...';
      chamar('baixa_entrar').then(function(r){ S.eu=r.nome; SB.pedido=''; substituicao(); })
      .catch(function(e){ S.senha=''; b.disabled=false; b.textContent='Entrar'; aviso(e.message==='senha'?'Senha errada':'Sem conexão. Tente de novo','erro',2800); });
    }
    $('#bok').onclick=ir; $('#bsen').addEventListener('keydown',function(e){ if(e.key==='Enter') ir(); });
  }

  var SB = { pedido:'', achados:[], fb:'', sel:null };
  function substituicao(){
    app.innerHTML = topoSimples(S.eu)+'<div class="caixa"><h2>Baixa de produto</h2>'+
      '<p class="dica">Use quando uma peça sai da prateleira sem venda, para trocar o produto de um pedido. Nunca mexa no estoque dentro da wBuy. Quem fez a baixa fica registrado pela sua senha.</p>'+
      '<label class="campo" for="bped">Número do pedido</label><input class="texto" id="bped" inputmode="numeric" autocomplete="off" value="'+esc(SB.pedido)+'">'+
      '<label class="campo" for="bbus">Produto que saiu (nome ou cor)</label><input class="texto" id="bbus" autocomplete="off" placeholder="ex.: camiseta hugo boss preta">'+
      '<button class="botao" id="bgo">Procurar</button><div id="bres"></div>'+
      '<h2 style="margin-top:26px">Últimas baixas</h2><div id="bhist"><p class="vazio">Carregando...</p></div>'+
      '<button class="link" id="bvolta">Voltar</button></div>';
    $('#bvolta').onclick = inicio;
    $('#bgo').onclick = procurarBaixa;
    $('#bbus').addEventListener('keydown', function(e){ if(e.key==='Enter') procurarBaixa(); });
    $('#bped').addEventListener('input', function(){ SB.pedido = this.value.trim(); });
    historicoBaixas();
  }
  function historicoBaixas(){
    chamar('baixa_lista').then(function(r){
      var h=''; (r.baixas||[]).forEach(function(b){
        h += '<div class="obsl"><b>'+esc(b.produto)+'</b> <em>'+esc(b.cor)+' · '+esc(b.tamanho)+' · '+b.quantidade+' un.</em><p>Pedido '+esc(b.pedido)+' · '+esc(b.nome)+'</p><span>'+hora(b.criado_em)+' · '+(b.status==='lancada'?'já lançada no site':b.status==='erro'?'erro, o Fábio vai ver':'aguardando o próximo horário')+'</span></div>';
      });
      var el=$('#bhist'); if(el) el.innerHTML = h || '<p class="vazio">Nenhuma baixa ainda.</p>';
    }).catch(function(){ var el=$('#bhist'); if(el) el.innerHTML='<p class="vazio">Não consegui carregar.</p>'; });
  }
  function procurarBaixa(){
    var q=$('#bbus').value.trim(); if(q.length<2){ aviso('Digite pelo menos 2 letras','erro',2200); return; }
    $('#bres').innerHTML='<p class="vazio">Procurando...</p>';
    chamar('baixa_buscar',{q:q}).then(function(r){
      SB.achados=ordenar(r.linhas); SB.fb=r.foto_base||'';
      var h=''; if(!SB.achados.length) h='<p class="vazio">Não achei. Tente outra palavra.</p>';
      SB.achados.forEach(function(l,i){
        var foto = l.f ? '<img class="foto" alt="" src="'+esc(SB.fb+encodeURIComponent(l.f))+'" loading="lazy">' : '<div class="foto">sem foto</div>';
        h += '<div class="cartao" style="margin-top:14px">'+foto+'<div class="nome">'+esc(l.p)+'</div><div class="cor">'+esc(l.c)+'</div><div class="grade">'+
          l.t.map(function(t){ return '<button class="botao cinza" style="margin:0;padding:12px 0" data-i="'+i+'" data-k="'+esc(t.k)+'">'+esc(t.n)+'</button>'; }).join('')+'</div></div>';
      });
      $('#bres').innerHTML=h;
      document.querySelectorAll('#bres .grade button').forEach(function(b){ b.onclick=function(){ escolherTamanhoBaixa(Number(b.dataset.i), b.dataset.k); }; });
    }).catch(function(){ $('#bres').innerHTML='<p class="vazio">Sem conexão. Tente de novo.</p>'; });
  }
  function escolherTamanhoBaixa(i,k){
    var l=SB.achados[i]; var t=l.t.filter(function(x){return x.k===k;})[0]; SB.sel={l:l,t:t};
    if(!SB.pedido){ aviso('Digite o número do pedido primeiro','erro',2600); window.scrollTo(0,0); return; }
    app.innerHTML = topoSimples(S.eu)+'<div class="caixa"><h2>Confirmar baixa</h2>'+
      '<div class="obsl"><b>'+esc(l.p)+'</b> <em>'+esc(l.c)+'</em><p>Tamanho <b>'+esc(t.n)+'</b> · pedido <b>'+esc(SB.pedido)+'</b></p></div>'+
      '<label class="campo" for="bqtd">Quantas peças saíram</label><input class="texto" id="bqtd" inputmode="numeric" value="1">'+
      '<label class="campo" for="bobs">Observação (opcional)</label><div class="obs" style="padding:0"><textarea id="bobs" placeholder="ex.: cliente trocou a cor"></textarea><button class="mic" id="bmic" type="button">Voz</button></div>'+
      '<button class="botao verde" id="bsalva">Dar baixa</button><button class="link" id="bcanc">Cancelar</button></div>';
    $('#bmic').onclick=function(){ ditar(this); };
    $('#bcanc').onclick=substituicao;
    $('#bsalva').onclick=function(){
      var q=Number($('#bqtd').value); if(!Number.isInteger(q)||q<1){ aviso('Quantidade inválida','erro',2200); return; }
      var btn=this; btn.disabled=true; btn.textContent='Salvando...';
      chamar('baixa_gravar',{},{pedido:SB.pedido,linha_id:l.id,sku:t.k,quantidade:q,observacao:$('#bobs').value}).then(function(r){
        aviso('Baixa registrada por '+(r.nome||''),'bom',3000); SB.sel=null; substituicao();
      }).catch(function(e){ btn.disabled=false; btn.textContent='Dar baixa'; aviso('Não salvou: '+e.message,'erro',3500); });
    };
    window.scrollTo(0,0);
  }

  /* ---------- Setor ---------- */
  function escolherSetor(){
    var h = '<div class="topo"><div class="linha1"><span class="marca">SP GRIFES</span><span class="quem">'+esc(S.eu)+' + '+esc(S.par)+'</span></div></div><div class="caixa">'+
      '<h2>Escolha o seu setor</h2><p class="dica">Cada dupla pega um setor diferente. Combine com a equipe antes de tocar.</p>';
    for(var s=1;s<=4;s++){ h += '<button class="setor" data-s="'+s+'">Setor '+s+'<span>'+(S.setores[s]||0)+' produtos</span></button>'; }
    h += '<button class="setor" data-s="0" style="border-color:#bbb">Ver todos<span>sem filtro</span></button><button class="link" id="svolta">Voltar</button></div>';
    app.innerHTML = h;
    $('#svolta').onclick = inicio;
    app.querySelectorAll('button.setor').forEach(function(b){ b.onclick = function(){ S.setor = Number(b.dataset.s); carregar('contar'); }; });
  }

  /* ---------- Lista ---------- */
  function carregar(modo){
    S.modo = modo;
    app.innerHTML = '<div class="caixa"><p class="vazio">Carregando produtos...</p></div>';
    chamar('lista',{modo:modo, setor:S.setor}).then(function(r){
      S.linhas = ordenar(r.linhas); S.fb = r.foto_base || ''; tela();
    }).catch(function(){
      app.innerHTML = '<div class="caixa"><p class="vazio">Não consegui carregar.</p><button class="botao" id="tentar">Tentar de novo</button></div>';
      $('#tentar').onclick = function(){ carregar(modo); };
    });
  }

  function feitos(){ return S.linhas.filter(function(l){ return l.feito || l.zok; }).length; }

  function atualizarTopo(){
    var f = feitos(), t = S.linhas.length;
    var c = $('#cont'); if(c) c.innerHTML = '<b>'+f+'</b> de '+t+' contados';
    var b = $('#prog'); if(b) b.style.width = (t? Math.round(f*100/t) : 0)+'%';
  }

  function ordTam(n){ var x=String(n||'').toUpperCase().replace(/[\s.]/g,''); var o={'PP':0,'P':1,'M':2,'G':3,'GG':4,'XG':5,'EG':5,'EXG':5,'EXTRAG':5,'G1':5,'XXG':6,'EGG':6,'G2':6,'G3':7}; if(o[x]!=null) return o[x]; var m=x.match(/^\d+/); return m? 100+Number(m[0]) : 50; }
  function ordenar(ls){ (ls||[]).forEach(function(l){ if(l.t) l.t.sort(function(a,b){ return ordTam(a.n)-ordTam(b.n); }); }); return ls||[]; }
  function tela(){
    var L = S.linhas, f = feitos();
    var h = '<div class="topo"><div class="linha1"><span class="marca">SP GRIFES</span><span class="quem">'+esc(S.eu)+' + '+esc(S.par)+(S.setor&&S.modo==='contar'?' · Setor '+S.setor:'')+'</span></div>'+
      '<div class="barra"><i id="prog" style="width:'+(L.length?Math.round(f*100/L.length):0)+'%"></i></div><div class="contador" id="cont"><b>'+f+'</b> de '+L.length+' contados</div></div>'+
      '<div class="abas">'+
      ab('contar','Contar')+ab('zerados','Zerados')+ab('inativos','Inativos')+'<button id="trocar">Setor</button></div><div class="caixa">';
    if(S.modo==='zerados') h += '<p class="dica">O site mostra zero nestes produtos. Se achar peça, digite a quantidade. Se está zerado mesmo, toque em Confirmado zero.</p>';
    if(S.modo==='inativos') h += '<p class="dica">Produtos escondidos do site. Conte se achar peça.</p>';
    if(!L.length) h += '<p class="vazio">Nenhum produto nesta lista.</p>';
    var ult = '';
    L.forEach(function(l,i){
      if(S.modo==='contar' && l.b && l.b!==ult){ h += '<div class="bloco">'+esc(l.b)+'</div>'; ult = l.b; }
      var foto = l.f ? '<img class="foto" loading="lazy" alt="" src="'+esc(S.fb+encodeURIComponent(l.f))+'">' : '<div class="foto">sem foto</div>';
      var grade = l.t.map(function(t){
        var v = (l.feito && l.feito.q && l.feito.q[t.k]!=null) ? l.feito.q[t.k] : '';
        return '<div><label for="q'+i+'_'+esc(t.k)+'">'+esc(t.n)+'</label><input id="q'+i+'_'+esc(t.k)+'" inputmode="numeric" pattern="[0-9]*" data-k="'+esc(t.k)+'" value="'+esc(v)+'"></div>';
      }).join('');
      h += '<div class="cartao'+((l.feito||l.zok)?' ok':'')+'" id="c'+i+'">'+foto+
        '<div class="nome">'+esc(l.p)+'</div><div class="cor">'+esc(l.c)+'</div>'+
        '<div class="grade">'+grade+'</div>'+
        '<div class="obs"><textarea rows="1" placeholder="Observação: tamanho que falta, defeito, foto diferente">'+esc(l.obs||'')+'</textarea>'+
        '<button class="mic" type="button" aria-label="Falar a observação">Voz</button></div>'+
        '<div class="feito">'+(l.feito?'Salvo por '+esc(l.feito.por):(l.zok?'Confirmado zero':''))+'</div>'+
        (S.modo==='zerados'?'<button class="botao cinza" data-a="zero" data-i="'+i+'">Confirmado zero</button>':'')+
        '<button class="botao verde" data-a="salvar" data-i="'+i+'">Salvar e próximo</button></div>';
    });
    h += '</div>';
    app.innerHTML = h;
    app.querySelectorAll('.abas button[data-m]').forEach(function(b){ b.onclick = function(){ carregar(b.dataset.m); }; });
    $('#trocar').onclick = escolherSetor;
    app.querySelectorAll('button[data-a]').forEach(function(b){
      b.onclick = function(){ var i = Number(b.dataset.i); if(b.dataset.a==='salvar') salvar(i,b); else zero(i,b); };
    });
    app.querySelectorAll('.mic').forEach(function(b){ b.onclick = function(){ ditar(b); }; });
  }
  function ab(m,t){ return '<button data-m="'+m+'" class="'+(S.modo===m?'on':'')+'">'+t+'</button>'; }

  function proximo(i){ var nx = document.getElementById('c'+(i+1)); if(nx) nx.scrollIntoView({behavior:'smooth',block:'start'}); }

  function salvar(i, btn){
    var c = document.getElementById('c'+i), qtd = {}, vazio = 0, ruim = false;
    c.querySelectorAll('.grade input').forEach(function(x){
      var v = x.value.trim();
      if(v===''){ vazio++; return; }
      if(!/^\d{1,5}$/.test(v)){ ruim = true; x.style.borderColor = '#c62828'; return; }
      x.style.borderColor = ''; qtd[x.dataset.k] = v;
    });
    if(ruim){ aviso('Use só números inteiros nos tamanhos','erro',2800); return; }
    if(!Object.keys(qtd).length){ aviso('Digite ao menos um número (0 se não tem)','erro',2800); return; }
    btn.disabled = true; btn.textContent = 'Salvando...';
    chamar('gravar',{},{contador:S.eu, parceiro:S.par, linha_id:S.linhas[i].id, qtd:qtd, obs:c.querySelector('textarea').value}).then(function(){
      c.classList.add('ok'); S.linhas[i].feito = {q:qtd, por:S.eu};
      c.querySelector('.feito').textContent = 'Salvo por '+S.eu;
      btn.disabled = false; btn.textContent = 'Salvar e próximo';
      atualizarTopo();
      aviso(vazio? 'Salvo. Tamanhos em branco não mudam no site' : 'Salvo','bom',1800);
      proximo(i);
    }).catch(function(e){
      btn.disabled = false; btn.textContent = 'Salvar e próximo';
      aviso('NÃO salvou: '+(e.message==='senha'?'senha':'sem conexão')+'. Toque em salvar de novo','erro',5000);
    });
  }

  function zero(i, btn){
    btn.disabled = true;
    chamar('zero_ok',{},{contador:S.eu, linha_id:S.linhas[i].id}).then(function(){
      var c = document.getElementById('c'+i); c.classList.add('ok'); S.linhas[i].zok = true;
      c.querySelector('.feito').textContent = 'Confirmado zero';
      btn.disabled = false; atualizarTopo(); aviso('Confirmado zero','bom',1500); proximo(i);
    }).catch(function(){ btn.disabled = false; aviso('NÃO salvou. Toque de novo','erro',5000); });
  }

  /* ---------- Painel do Fabio (senha propria) ---------- */
  var timerPainel = null;
  function painelEntrada(){
    app.innerHTML =
      '<div class="topo"><div class="linha1"><span class="marca">SP GRIFES</span><span class="quem">Área do Fábio</span></div></div>'+
      '<div class="caixa entrada"><h1>Painel da contagem</h1>'+
      '<p class="dica">Acompanhe de qualquer lugar quem já contou e o que falta.</p>'+
      '<label class="campo" for="psen">Senha do painel</label>'+
      '<input class="texto" id="psen" type="password" autocomplete="off">'+
      '<button class="botao" id="pent">Abrir painel</button>'+
      '<button class="link" id="pvolta">Voltar</button></div>';
    $('#pent').onclick = function(){ S.senhaPainel = $('#psen').value; painel(true); };
    $('#psen').addEventListener('keydown', function(e){ if(e.key==='Enter'){ S.senhaPainel = $('#psen').value; painel(true); } });
    $('#pvolta').onclick = function(){ clearInterval(timerPainel); inicio(); };
  }

  function barraHtml(rot, f, t){
    var p = t ? Math.round(f*100/t) : 0;
    return '<div class="pl"><div class="pl1"><b>'+esc(rot)+'</b><span>'+f+' de '+t+' · '+p+'%</span></div><div class="pb"><i style="width:'+p+'%"></i></div></div>';
  }
  function hora(iso){
    try{ return new Date(iso).toLocaleString('pt-BR',{timeZone:'America/Sao_Paulo',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}); }catch(e){ return ''; }
  }

  function histHtml(L){
    return (L||[]).map(function(x){
      var dif = (x.contado!=null && x.site!=null) ? x.contado-x.site : 0;
      var tam = (x.det||[]).map(function(t){ return esc(t.t)+': '+t.c+(t.s!=null?' (site '+t.s+')':''); }).join(' · ');
      return '<div class="obsl"><b>'+esc(x.produto)+'</b> <em>'+esc(x.cor)+(x.setor?' · setor '+x.setor:'')+'</em><p>Contou: <b>'+esc(x.contador)+(x.parceiro?' e '+esc(x.parceiro):'')+'</b> · '+hora(x.quando)+'</p><p>'+tam+'</p><span>total contado '+x.contado+', site '+x.site+(dif?' · diferença '+(dif>0?'+':'')+dif:'')+'</span></div>';
    }).join('');
  }
  function painel(primeira){
    fetch(API+'?'+new URLSearchParams({acao:'painel', senha:S.senhaPainel||''}).toString()).then(function(r){
      return r.json().catch(function(){ return {erro:'rede'}; }).then(function(j){ if(!r.ok) throw new Error(j.erro||'erro'); return j; });
    }).then(function(d){
      var tot = 0, fei = 0;
      (d.setores||[]).forEach(function(s){ tot += s.total; fei += s.feitas; });
      var h = '<div class="topo"><div class="linha1"><span class="marca">SP GRIFES</span><span class="quem">Painel · atualizado '+hora(d.agora)+'</span></div>'+
        '<div class="barra"><i style="width:'+(tot?Math.round(fei*100/tot):0)+'%"></i></div><div class="contador"><b>'+fei+'</b> de '+tot+' produtos ativos contados</div></div>'+
        '<div class="caixa"><h2>Apuração por setor</h2><p class="dica">Do mais adiantado para o mais atrasado.</p>';
      var rank = (d.setores||[]).slice().sort(function(a,b){ return (b.total?b.feitas/b.total:0)-(a.total?a.feitas/a.total:0); });
      var agora = new Date(d.agora).getTime();
      rank.forEach(function(sx, pos){
        var ds = (d.duplas_setor||[]).filter(function(x){ return x.setor===sx.setor; }).sort(function(a,b){ return b.linhas-a.linhas; });
        var nomes = ds.length ? ds.map(function(x){ return esc(x.contador)+(x.parceiro?' e '+esc(x.parceiro):''); }).join(' / ') : 'ninguém começou';
        var pct = sx.total?Math.round(sx.feitas*100/sx.total):0;
        h += '<div class="setorap"><div class="pl1"><b>'+(pos+1)+'º · Setor '+sx.setor+'</b><span>'+sx.feitas+' de '+sx.total+' · '+pct+'%</span></div>'+
          '<div class="pb"><i style="width:'+pct+'%"></i></div><div class="nomes">'+nomes+'</div>';
        ds.forEach(function(x){
          var horas = Math.max((new Date(x.ultimo)-new Date(x.primeiro))/3600000, 1/12);
          var ritmo = Math.round(x.linhas/horas);
          var parado = Math.round((agora-new Date(x.ultimo).getTime())/60000);
          var cor = parado>=20 ? 'atraso' : 'bom';
          h += '<div class="ritmo '+cor+'">'+esc(x.contador)+(x.parceiro?' e '+esc(x.parceiro):'')+': '+x.linhas+' produtos, '+ritmo+' por hora · último salvo há '+(parado<1?'menos de 1':parado)+' min'+(parado>=20?' · PARADO':'')+'</div>';
        });
        h += '</div>';
      });
      h += '<h2 style="margin-top:20px">Zerados e inativos</h2>'+
        barraHtml('Zerados conferidos', d.zerados?d.zerados.feitas:0, d.zerados?d.zerados.total:0)+
        barraHtml('Inativos contados', d.inativos?d.inativos.feitas:0, d.inativos?d.inativos.total:0)+
        '<h2 style="margin-top:20px">Duplas</h2>';
      if(!(d.duplas||[]).length) h += '<p class="vazio">Ainda ninguém salvou nada.</p>';
      (d.duplas||[]).forEach(function(x){
        h += '<div class="dupla"><div><b>'+esc(x.contador)+'</b> + '+esc(x.parceiro||'-')+'<span>último salvo '+hora(x.ultimo)+'</span></div><strong>'+x.linhas+'</strong></div>';
      });
      h += '<h2 style="margin-top:20px">Observações ('+(d.obs||0)+')</h2>';
      if(!(d.observacoes||[]).length) h += '<p class="vazio">Nenhuma observação ainda.</p>';
      (d.observacoes||[]).forEach(function(o){
        h += '<div class="obsl"><b>'+esc(o.produto)+'</b> <em>'+esc(o.cor)+(o.setor?' · setor '+o.setor:'')+'</em><p>'+esc(o.texto)+'</p><span>'+esc(o.por)+' · '+hora(o.em)+'</span></div>';
      });
      h += '<h2 style="margin-top:20px">Quem contou cada produto</h2><p class="dica">Os últimos salvos. Procure um produto pelo nome para ver quem contou.</p>'+
        '<input class="texto" id="hbus" placeholder="ex.: camiseta boss" autocomplete="off"><button class="botao cinza" id="hgo">Procurar produto</button><div id="hres">'+histHtml(d.recentes)+'</div>';
      h += '<h2 style="margin-top:20px">Baixas de produto ('+(d.baixas||[]).length+')</h2><p class="dica">Lançamento automático na wBuy: '+(d.lancamento_ligado?'LIGADO (seg a sex 8h30, 10h30, 12h30, 15h30, 17h30)':'DESLIGADO (as baixas ficam guardadas até você liberar)')+'.</p>';
      if(!(d.baixas||[]).length) h += '<p class="vazio">Nenhuma baixa ainda.</p>';
      (d.baixas||[]).forEach(function(b){
        h += '<div class="obsl"><b>'+esc(b.produto)+'</b> <em>'+esc(b.cor)+' · '+esc(b.tamanho)+' · '+b.quantidade+' un.</em><p>Pedido '+esc(b.pedido)+' · '+esc(b.nome)+(b.observacao?' · '+esc(b.observacao):'')+'</p><span>'+hora(b.criado_em)+' · '+(b.status==='lancada'?'lançada: '+b.antes+' para '+b.depois:b.status==='erro'?'ERRO: '+esc(b.erro||''):'pendente')+'</span></div>';
      });
      h += '<p class="dica" style="margin-top:18px">Total de números gravados: '+(d.total_registros||0)+'. A tela se atualiza sozinha a cada 30 segundos.</p>'+
        '<button class="botao" id="patu">Atualizar agora</button><button class="link" id="psai">Sair do painel</button></div>';
      app.innerHTML = h;
      $('#patu').onclick = function(){ painel(false); };
      $('#hgo').onclick = function(){ var q=$('#hbus').value.trim(); if(q.length<2) return; clearInterval(timerPainel);
        fetch(API+'?'+new URLSearchParams({acao:'historico_produto',senha:S.senhaPainel||'',q:q}).toString()).then(function(r){return r.json();}).then(function(j){ $('#hres').innerHTML = histHtml(j.itens)||'<p class="vazio">Nada contado com esse nome.</p>'; }); };
      $('#psai').onclick = function(){ clearInterval(timerPainel); inicio(); };
      clearInterval(timerPainel);
      timerPainel = setInterval(function(){ painel(false); }, 30000);
    }).catch(function(e){
      if(primeira){ aviso(e.message==='senha' ? 'Senha do painel errada' : 'Sem conexão. Tente de novo','erro',3000); }
    });
  }

  /* ---------- Voz na observacao (quando o aparelho permite) ---------- */
  var rec = null;
  function ditar(btn){
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(!SR){ aviso('Este aparelho não aceita voz. Digite a observação','erro',2800); return; }
    if(rec){ try{ rec.stop(); }catch(e){} rec = null; return; }
    var ta = btn.parentNode.querySelector('textarea');
    rec = new SR(); rec.lang = 'pt-BR'; rec.interimResults = false;
    rec.onresult = function(e){ var t = ''; for(var k=e.resultIndex;k<e.results.length;k++) t += e.results[k][0].transcript; ta.value = (ta.value? ta.value+' ' : '') + t.trim(); };
    rec.onend = function(){ btn.classList.remove('gravando'); btn.textContent = 'Voz'; rec = null; };
    rec.onerror = function(){ btn.classList.remove('gravando'); btn.textContent = 'Voz'; rec = null; };
    btn.classList.add('gravando'); btn.textContent = 'Parar';
    try{ rec.start(); }catch(e){ rec = null; btn.classList.remove('gravando'); btn.textContent = 'Voz'; }
  }

  inicio();
})();
</script>
</body>
</html>
